[project]
name = "local-corex-experiments"
version = "0.1.0"
description = "Experiment notebooks and scripts that depend on the local-corex package"
requires-python = ">=3.9,<3.13"
dependencies = [
    "local-corex",
    "jupyter",
    "matplotlib",
    "pandas",
    "numpy",
    "scikit-learn",
    "phate>=2.0.0",
    "imageio>=2.37.2",
    "pytorch-lightning>=2.6.0",
    "torchvision>=0.23.0",
]

[tool.uv.sources]
local-corex = { git = "https://github.com/TomKerbyLab/Local_CorEx.git", branch = "main" }

[tool.pytest.ini_options]
# The experiment packages name their validation modules tests.py (not the
# pytest default test_*.py), so pytest never collected them without this.
python_files = ["test_*.py", "tests.py"]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]
